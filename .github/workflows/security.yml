# Supply-chain scanning on every PR and every push to main:
#   - SBOM (CycloneDX) for the Go server and the npm webapp
#   - Grype CVE scan of both SBOMs, gated at HIGH
#   - CodeQL static analysis of Go and JavaScript/TypeScript
# SARIF from every scanner is uploaded to GitHub Code Scanning so
# findings show up inline on the PR and in the Security tab.
#
# Everything runs through the same `make` targets the release pipeline
# uses locally (make sbom / codeql-analyze / security-gate) — CI and a
# developer's `make release` stay in lock-step, so a green PR here means
# a green release build.
#
# Build gates:
#   - Grype:  --fail-on high blocks HIGH/CRITICAL CVEs (see .grype.yaml
#             for any documented, time-boxed exceptions)
#   - CodeQL: `make security-gate` fails on error-level SARIF findings
#   - SARIF upload to Code Scanning: required, no bypass
#
# REQUIREMENT: GitHub Code Scanning must be enabled on the repo.
#   - Public repos: free — Settings -> Code security and analysis
#   - Private repos: needs GitHub Advanced Security (paid)
# Without it the SARIF upload fails and the workflow goes red. That is
# intentional — security findings must reach the Security tab.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-run catches newly-disclosed CVEs even with no code
    # changes — GHSA/NVD publish continuously, and a stable plugin
    # might otherwise go weeks between PRs.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write  # upload SARIF to code scanning
  actions: read

jobs:
  sbom-scan:
    name: SBOM + Grype vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # This job only reads the repo and uploads SARIF via GITHUB_TOKEN;
          # it never pushes, so don't persist the git token in the workspace.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # cyclonedx-npm reads the installed tree, so webapp deps must be
      # present before `make sbom` runs.
      - name: Install webapp dependencies
        run: cd webapp && npm ci

      - name: Generate SBOMs (server + webapp)
        run: make sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/sbom/
          retention-days: 30

      # Scan each SBOM with Grype and emit SARIF for Code Scanning.
      # fail-build: true reproduces `make sbom-scan`'s --fail-on high
      # gate. Separate categories keep server vs webapp findings distinct
      # in the Security tab.
      - name: Scan Go SBOM (Grype -> SARIF)
        id: grype-server
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: dist/sbom/server-sbom.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Go Grype SARIF to code scanning
        if: always() && steps.grype-server.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: ${{ steps.grype-server.outputs.sarif }}
          category: grype-server

      - name: Scan webapp SBOM (Grype -> SARIF)
        id: grype-webapp
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: dist/sbom/webapp-sbom.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload webapp Grype SARIF to code scanning
        if: always() && steps.grype-webapp.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: ${{ steps.grype-webapp.outputs.sarif }}
          category: grype-webapp

  codeql:
    name: CodeQL static analysis (Go + JS/TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # This job only reads the repo and uploads SARIF via GITHUB_TOKEN;
          # it never pushes, so don't persist the git token in the workspace.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # codeql-js builds a database from the webapp source and needs the
      # dependency tree present.
      - name: Install webapp dependencies
        run: cd webapp && npm ci

      # Cache the CodeQL CLI bundle (~500MB) that `make install-codeql`
      # downloads. Keyed on the version pinned in the Makefile so a bump
      # there busts the cache automatically.
      - name: Cache CodeQL CLI bundle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/codeql
          key: codeql-cli-${{ runner.os }}-2.20.1

      # Runs codeql-go + codeql-js, writing dist/codeql-go.sarif and
      # dist/codeql-js.sarif — the exact files `make security-gate` and
      # the release bundle consume.
      - name: Run CodeQL analysis (Go + JS/TS)
        run: make codeql-analyze

      # Same gate as `make release`: fails on any error-level finding
      # across dist/codeql-*.sarif.
      - name: Run security gate (fail on critical/high findings)
        run: make security-gate

      - name: Upload Go CodeQL SARIF to code scanning
        if: always() && hashFiles('dist/codeql-go.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: dist/codeql-go.sarif
          category: codeql-go

      - name: Upload JS/TS CodeQL SARIF to code scanning
        if: always() && hashFiles('dist/codeql-js.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: dist/codeql-js.sarif
          category: codeql-js

      - name: Upload CodeQL SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: dist/codeql-*.sarif
          retention-days: 30
